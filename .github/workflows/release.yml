name: Release
on:
  push:
    tags: ['*-RG']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/build.yml
  release:
    needs: verify
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: rich-text-area-release
          path: target/release
      - name: Publish verified fork release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          version=$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("rta/pom.xml").findtext("{*}version"))')
          test "$RELEASE_TAG" = "$version"
          gh release create "$RELEASE_TAG" target/release/* --verify-tag --latest \
            --title "Rich Text Area $RELEASE_TAG" --notes-file "releases/$RELEASE_TAG.md"
